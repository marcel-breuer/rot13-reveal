name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/AGENTS.md"
      - ".agent/**"
      - "LICENSE"
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "**/AGENTS.md"
      - ".agent/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.2.3"

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.2.3-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run lint
      run: bun run lint

    - name: Run tests
      run: bun run test

    - name: Run build
      run: bun run build
